<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STI2D</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #1f1e1c;
  --muted: #6b6a65;
  --border: #dcd9d0;
  --accent: #185fa5;
  --accent-bg: #e6f1fb;
  --val: #854f0b;
  --val-bg: #faeeda;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1a;
    --surface: #242422;
    --text: #ecebe6;
    --muted: #a3a29b;
    --border: #3a3a37;
    --accent: #85b7eb;
    --accent-bg: #0c447c;
    --val: #fac775;
    --val-bg: #4a3209;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
main { max-width: 780px; margin: 0 auto; padding: 48px 24px; }
header { margin-bottom: 28px; }
h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
.sub { font-size: 14px; color: var(--muted); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px 28px; transition: border-color .15s;
}
.card:hover, .card:focus-within { border-color: var(--accent); }
.crumb { font-size: 13px; color: var(--muted); }
.card h2 { font-size: 22px; font-weight: 600; margin: 2px 0 0; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.go {
  text-decoration: none; border: 1px solid var(--accent); color: var(--accent);
  border-radius: 8px; padding: 8px 16px; font-size: 15px;
}
.go:hover, .go:focus-visible { background: var(--accent-bg); outline: none; }
footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
@media (max-width: 860px) {
  main { padding: 28px 16px; }
  .card { padding: 18px 16px; }
  h1 { font-size: 22px; }
}
</style>
</head>

    </div>
    <div class="card">

    </div>
    <div class="card">

      <h2>SIN</h2>
      <div class="links"><a class="go" href="Cours_SIN.html">Cours →</a><a class="go" href="Exercices_SIN.html">Exercices →</a></div>
    </div>
    <div class="card">
      <div class="crumb">Terminale STI2D</div>
      <h2>ITEC</h2>
      <div class="links"><a class="go" href="Cours_ITEC.html">Cours →</a><a class="go" href="Exercices_ITEC.html">Exercices →</a></div>
    </div>
  </div>
</main>
</body>
</html>
