<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours ITEC</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --side: #efede6;
  --text: #1f1e1c;
  --muted: #6b6a65;
  --border: #dcd9d0;
  --accent: #185fa5;
  --accent-bg: #e6f1fb;
  --val: #854f0b;
  --val-bg: #faeeda;
  --ok: #27500a;
  --ok-bg: #eaf3de;
  --ok-border: #639922;
  --code-bg: #f1efe8;
  --bad-bg: #fcebeb;
  --bad-border: #e24b4a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a;
    --surface: #242422;
    --side: #20201e;
    --text: #ecebe6;
    --muted: #a3a29b;
    --border: #3a3a37;
    --accent: #85b7eb;
    --accent-bg: #0c447c;
    --val: #fac775;
    --val-bg: #4a3209;
    --ok: #c0dd97;
    --ok-bg: #1f3309;
    --ok-border: #639922;
    --code-bg: #2c2c2a;
    --bad-bg: #3d1414;
    --bad-border: #e24b4a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1a;
  --surface: #242422;
  --side: #20201e;
  --text: #ecebe6;
  --muted: #a3a29b;
  --border: #3a3a37;
  --accent: #85b7eb;
  --accent-bg: #0c447c;
  --val: #fac775;
  --val-bg: #4a3209;
  --ok: #c0dd97;
  --ok-bg: #1f3309;
  --ok-border: #639922;
  --code-bg: #2c2c2a;
  --bad-bg: #3d1414;
  --bad-border: #e24b4a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }

/* Barre latérale */
.sidebar {
  background: var(--side);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar h1 { font-size: 18px; font-weight: 600; margin: 0 8px 4px; }
a.home {
  display: inline-block; text-decoration: none; color: var(--accent); font-size: 14px;
  border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px;
}
a.home:hover, a.home:focus-visible { background: var(--accent-bg); outline: none; }
.sidebar a.home { margin: 0 8px 14px; }
.topbar a.home { margin-left: auto; }
.sidebar .sub { font-size: 13px; color: var(--muted); margin: 0 8px 16px; }
.chap { margin-bottom: 2px; }
.chap-btn {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  text-align: left; border: 0; border-radius: 8px; padding: 8px 8px;
  line-height: 1.35;
}
.chap-btn:hover { background: var(--border); }
.chap-btn .arrow { flex: none; margin-top: 10px; color: var(--muted); transition: transform .15s; }
.chap-btn[aria-expanded="true"] .arrow { transform: rotate(180deg); }
.chap-btn.on .seq, .chap-btn.on .arrow { color: var(--accent); }
.nav .seq { font-size: 12px; color: var(--muted); display: block; }
.nav .ex { font-size: 14px; font-weight: 500; }
.exlist { padding: 2px 0 6px 32px; }
.exlist[hidden] { display: none; }
.exlist a {
  display: block; text-decoration: none; color: var(--text); font-size: 14px;
  padding: 6px 10px; border-radius: 0 8px 8px 0; border-left: 2px solid var(--border);
}
.exlist a:hover { background: var(--border); }
.exlist a.on { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); }

/* Barre du haut (mobile) */
.topbar { display: none; }

/* Contenu */
main { padding: 32px 24px 48px; }
.card {
  max-width: 780px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px 28px;
}
.crumb { font-size: 13px; color: var(--muted); }
.card h2 { font-size: 22px; font-weight: 600; margin: 2px 0 4px; }
.support { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
.v {
  background: var(--val-bg); color: var(--val);
  padding: 1px 5px; border-radius: 5px; font-weight: 500;
  /* Une valeur longue (suite d'événements, octets…) peut passer à la ligne ; nombre et unité restent liés par une espace insécable */
  overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
pre .v { overflow-wrap: normal; }
ol.q { padding-left: 22px; margin: 12px 0 0; }
ol.q li { margin-bottom: 4px; }
pre.code {
  background: var(--code-bg); border-radius: 8px; padding: 12px 14px;
  font-size: 14px; line-height: 1.5; overflow-x: auto; margin: 12px 0;
}
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
button {
  font: inherit; font-size: 15px; cursor: pointer;
  background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px;
}
button:hover { background: var(--side); }
button.primary { border-color: var(--accent); color: var(--accent); }
.correction {
  margin-top: 20px; padding: 14px 18px;
  background: var(--ok-bg); border-left: 4px solid var(--ok-border);
}
.correction[hidden] { display: none; }
.correction h3 { font-size: 15px; font-weight: 600; color: var(--ok); margin: 0 0 8px; }
.step { margin-bottom: 12px; }
.step:last-child { margin-bottom: 0; }
.step .lab { font-size: 14px; font-weight: 600; color: var(--ok); }
.step p { margin: 2px 0; }
.mdisp { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.mdisp.mwrap { text-align: center; line-height: 2.2; margin: 6px 0; }
@media (max-width: 600px) {
  table.t { font-size: 13px; }
  table.t th, table.t td { padding: 3px 6px; }
  pre.code { font-size: 12px; padding: 10px; }
  table.t th, table.t td { overflow-wrap: anywhere; hyphens: auto; }
}
/* QCM */
ol.qcm { padding-left: 22px; margin: 12px 0 0; }
ol.qcm > li { margin-bottom: 14px; }
ol.qcm > li > p { margin: 0 0 6px; }
ol.qcm label {
  display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
  padding: 6px 10px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 8px;
}
ol.qcm label:hover { background: var(--side); }
ol.qcm input { margin-top: 5px; accent-color: var(--accent); }
ol.qcm label.good { border-color: var(--ok-border); background: var(--ok-bg); }
ol.qcm label.bad { border-color: var(--bad-border); background: var(--bad-bg); }
.score { font-weight: 600; color: var(--ok); margin: 0 0 10px; }
.score:empty { display: none; }

/* Tableaux et schémas */
table.t { border-collapse: collapse; margin: 10px 0; font-size: 15px; }
table.t th, table.t td { border: 1px solid var(--border); padding: 4px 10px; text-align: center; }
table.t th { background: var(--side); font-weight: 600; }
.tw { overflow-x: auto; }
figure.fig { margin: 12px 0; text-align: center; }
figure.fig svg { width: 100%; max-width: 560px; height: auto; }
figure.fig svg.small { max-width: 220px; }
svg.sym { display: block; width: 150px; height: auto; margin: 6px 0; }
figure.fig svg.leds { max-width: 400px; }
figcaption { font-size: 13px; color: var(--muted); }
svg text { fill: var(--text); font-size: 12px; font-family: inherit; }
svg text.lab { fill: var(--muted); font-size: 12px; }
svg .grid { stroke: var(--border); stroke-width: 1; }
svg .ax { stroke: var(--muted); stroke-width: 1.4; }
svg .c1 { fill: none; stroke: var(--accent); stroke-width: 2.2; }
svg .c2 { fill: none; stroke: var(--val); stroke-width: 2; }
svg .c3 { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 4; }
svg .pt { fill: var(--val); }
svg .line { stroke: var(--text); stroke-width: 2; fill: none; }
svg .thin { stroke: var(--text); stroke-width: 1.2; fill: none; }
svg .fillv { fill: var(--val-bg); stroke: var(--val); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.4; fill: none; }
svg .arrowv { stroke: var(--val); stroke-width: 2.4; fill: none; }
svg .flow { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1; }
svg .loss { fill: var(--val-bg); stroke: var(--val); stroke-width: 1; }
svg .ledon { fill: #e5484d; stroke: var(--text); }
svg .ledoff { fill: var(--side); stroke: var(--muted); }

/* Fiches de cours */
.card h3 { font-size: 18px; font-weight: 600; color: var(--accent); margin: 26px 0 8px; }
.card p { margin: 8px 0; }
.card p.support { margin: 0 0 16px; }
ul.l { padding-left: 22px; margin: 8px 0; }
ul.l li { margin-bottom: 4px; }
.box, .exm { border-radius: 0 8px 8px 0; padding: 10px 16px; margin: 16px 0; }
.box { background: var(--accent-bg); border-left: 4px solid var(--accent); }
.exm { background: var(--ok-bg); border-left: 4px solid var(--ok-border); }
.box-t { font-size: 14px; font-weight: 600; color: var(--accent); }
.exm .box-t { color: var(--ok); }
.box p, .exm p { margin: 4px 0; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
.blk { border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 10px; background: var(--surface); text-align: center; font-size: 14px; }
.blk span { display: block; font-size: 12px; color: var(--muted); }
.arr { color: var(--accent); font-weight: 600; }
a.go {
  text-decoration: none; border: 1px solid var(--accent); color: var(--accent);
  border-radius: 8px; padding: 8px 16px; font-size: 15px;
}
a.go:hover, a.go:focus-visible { background: var(--accent-bg); outline: none; }
/* Fiches : on ne coupe pas les mots dans les cases, la colonne prend la largeur du mot le plus long */
@media (max-width: 600px) {
  table.t th, table.t td { overflow-wrap: break-word; hyphens: manual; padding: 3px 4px; }
}

.pager { display: flex; justify-content: space-between; gap: 10px; max-width: 780px; margin: 16px auto 0; }
.pager button { font-size: 14px; }

@media (max-width: 860px) {
  .layout { display: block; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 5;
    background: var(--side); border-bottom: 1px solid var(--border); padding: 10px 16px;
  }
  .topbar span { font-weight: 600; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 10; width: 290px; max-width: 85vw;
    transform: translateX(-100%); transition: transform .2s;
  }
  .sidebar.open { transform: none; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }
  .shade[hidden] { display: none; }
  main { padding: 16px 16px 40px; }
  .card { padding: 18px 16px; }
  .card h2 { font-size: 19px; }
}
/* Symboles des liaisons : pièce 1 en bleu, pièce 2 en orange */
svg .l1 { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-linecap: round; }
svg .l2 { stroke: var(--val); stroke-width: 2.6; fill: none; stroke-linecap: round; }
svg .f1 { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.6; }
svg .f2 { fill: var(--val-bg); stroke: var(--val); stroke-width: 2.6; }
.lias { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-flow: dense; gap: 10px; margin: 14px 0; }
.lia { border: 1px solid var(--border); border-radius: 8px; padding: 6px 6px 8px; text-align: center; background: var(--surface); }
.lia.w2 { grid-column: span 2; }
.lia b { display: block; font-size: 14px; }
.lia span { display: block; font-size: 12px; color: var(--muted); }
svg.liasym { display: block; width: 100%; max-width: 150px; height: auto; margin: 0 auto 4px; }
svg .fk { fill: var(--text); stroke: var(--text); stroke-width: 1; }
.train { margin-top: 22px; }
.train b { display: block; font-size: 14px; color: var(--muted); }
.train .btns { margin-top: 8px; }
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" aria-label="Ouvrir le menu">☰</button>
  <span>Cours ITEC</span>
  <a class="home" href="index.html">← Accueil</a>
</div>
<div class="shade" id="shade" hidden></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <a class="home" href="index.html">← Accueil</a>
    <h1>Cours ITEC</h1>
    <p class="sub">Terminale STI2D · spécialité ITEC</p>
    <div class="nav" id="nav"></div>
  </nav>
  <main>
    <article class="card" id="card"></article>
    <div class="pager">
      <button id="prevBtn">← Précédent</button>
      <button id="nextBtn">Suivant →</button>
    </div>
  </main>
</div>

<script>
// ---------- Outils ----------
const rnd = (a, b, step = 1) => {
  const n = Math.round((b - a) / step);
  return +(a + step * Math.floor(Math.random() * (n + 1))).toFixed(6);
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Nombre au format français (texte)
const fr = (x, d = 2) => Number(x).toLocaleString('fr-FR', { maximumFractionDigits: d });
// Nombre au format français (LaTeX)
const tx = (x, d = 2) => fr(x, d).replace(',', '{,}').replace(/[\u202f\u00a0]/g, '\\,');
// Nombre avec un nombre fixe de décimales (texte / LaTeX)
const frf = (x, d) => Number(x).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const txf = (x, d) => frf(x, d).replace(',', '{,}').replace(/[  ]/g, '\\,');
// Écriture scientifique en LaTeX
const sci = (x, d = 2) => {
  let e = Math.floor(Math.log10(Math.abs(x)));
  if (Math.abs(+(x / 10 ** e).toFixed(d)) >= 10) e++;
  return `${tx(x / 10 ** e, d)} \\times 10^{${e}}`;
};
// Nombre avec s chiffres significatifs : décimal si raisonnable, sinon scientifique
const tn = (x, s = 3) => {
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e-3 && a < 1e6) return tx(x, Math.max(0, s - 1 - Math.floor(Math.log10(a))));
  return sci(x, s - 1);
};
const fn = (x, s = 3) => {
  const a = Math.abs(x);
  if (a === 0) return '0';
  return fr(x, Math.max(0, s - 1 - Math.floor(Math.log10(a))));
};
const deg = a => a * Math.PI / 180;
const G = 9.81;
// Valeur surlignée dans l'énoncé
const v = (x, unit = '', d = 2) => `<span class="v">${typeof x === 'number' ? fr(x, d) : x}${unit ? '\u00a0' + unit : ''}</span>`;
// Formules
const m = t => `<span class="m" data-tex="${t.replace(/"/g, '&quot;')}"></span>`;
const M = t => `<div class="m mdisp" data-d="1" data-tex="${t.replace(/"/g, '&quot;')}"></div>`;
// Unité en LaTeX (gère ², ³, ·, °, µ)
const u = s => '\\,\\text{' + s.replace(/%/g, '\\%').replace(/²/g,'}^2\\text{').replace(/³/g, '}^3\\text{')
  .replace(/·/g, '}\\cdot\\text{').replace(/°/g, '}{}^\\circ\\text{').replace(/[µμ]/g, '}\\mu\\text{') + '}';

// Liste des questions d'un énoncé
const ol = (...items) => `<ol class="q">${items.map(i => `<li>${i}</li>`).join('')}</ol>`;
// Tableau HTML : en-têtes puis lignes
const table = (head, rows) => `<div class="tw"><table class="t"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${
  rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const euro = x => frf(x, 2) + ' €';
const teuro = x => txf(x, 2) + u('€');

// ---------- Tirages ----------
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const sample = (arr, n) => shuffle(arr).slice(0, n);

// ---------- QCM ----------
// Banque : [question, bonne réponse, [mauvaises réponses], explication]
const QCM_N = 5;
function qcm(bank, n = QCM_N) {
  const id = 'q' + Math.random().toString(36).slice(2, 8);
  const items = sample(bank, Math.min(n, bank.length)).map(([q, ok, bad, ex]) => {
    const choices = shuffle([ok, ...sample(bad.filter(b => b !== ok), 3)]);
    return { q, ok, ex, choices, k: choices.indexOf(ok) };
  });
  return {
    qcm: true,
    statement: `<p>Choisir la bonne réponse pour chaque question.</p>
      <ol class="qcm">${items.map((it, i) => `<li data-ok="${it.k}"><p>${it.q}</p>${it.choices.map((c, j) =>
        `<label><input type="radio" name="${id}${i}" value="${j}"> <span>${c}</span></label>`).join('')}</li>`).join('')}</ol>`,
    steps: items.map((it, i) => [`${i + 1}. ${it.ok}`, it.ex ? `<p>${it.ex}</p>` : ''])
  };
}
// Questions construites à partir de couples (élément, réponse)
const fromPairs = (pairs, fmt, ex) =>
  pairs.map(([a, b]) => [fmt(a), b, [...new Set(pairs.map(p => p[1]))], ex ? ex(a, b) : '']);
// Exercice QCM
const Q = (chap, title, support, bank) => ({ chap, title, support, gen: () => qcm(typeof bank === 'function' ? bank() : bank) });

// ---------- Schémas SVG ----------
const fig = (svg, cap = '') => `<figure class="fig">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
// Graphique gradué : o = {x0, x1, dx, y0, y1, dy, xlab, ylab, series: [{pts, cls}], extra(X, Y), nolab}
function graph(o) {
  const W = o.w || 560, H = o.h || 270, L = 50, R = 16, T = 14, B = 34;
  const X = x => +(L + (x - o.x0) / (o.x1 - o.x0) * (W - L - R)).toFixed(1);
  const Y = y => +(H - B - (y - o.y0) / (o.y1 - o.y0) * (H - T - B)).toFixed(1);
  const fx = o.fx || (x => fr(x, 3)), fy = o.fy || (y => fr(y, 3));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graph" role="img">`;
  const nx = Math.round((o.x1 - o.x0) / o.dx), ny = Math.round((o.y1 - o.y0) / o.dy);
  for (let i = 0; i <= nx; i++) {
    const x = o.x0 + i * o.dx;
    s += `<line class="grid" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${H - B}"/>`;
    if (!o.nolab) s += `<text x="${X(x)}" y="${H - B + 15}" text-anchor="middle">${fx(x)}</text>`;
  }
  for (let i = 0; i <= ny; i++) {
    const y = o.y0 + i * o.dy;
    s += `<line class="grid" x1="${L}" y1="${Y(y)}" x2="${W - R}" y2="${Y(y)}"/>`;
    if (!o.nolab) s += `<text x="${L - 6}" y="${Y(y) + 4}" text-anchor="end">${fy(y)}</text>`;
  }
  if (o.y0 < 0 && o.y1 > 0) s += `<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W - R}" y2="${Y(0)}"/>`;
  s += `<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/><line class="ax" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>`;
  if (o.xlab) s += `<text x="${W - R}" y="${H - 4}" text-anchor="end" class="lab">${o.xlab}</text>`;
  if (o.ylab) s += `<text x="${L + 6}" y="${T + 12}" class="lab">${o.ylab}</text>`;
  (o.series || []).forEach(se => {
    s += `<polyline class="${se.cls || 'c1'}" points="${se.pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}"/>`;
  });
  if (o.extra) s += o.extra(X, Y);
  return fig(s + '</svg>', o.cap);
}
// Échantillonne une fonction pour un graphique
const curve = (f, x0, x1, n = 400) => Array.from({ length: n + 1 }, (_, i) => { const x = x0 + (x1 - x0) * i / n; return [x, f(x)]; });
// Diagramme de Sankey en ligne : étapes [{name, val}] (val peut être '?') ; les pertes partent vers le bas
function sankey(stages, vals, unit) {
  const W = 560, H = 220, top = 40, x0 = 20, x1 = W - 20, seg = (x1 - x0) / stages.length;
  const k = 90 / vals[0];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="sankey" role="img">`;
  stages.forEach((st, i) => {
    const h = vals[i] * k, xa = x0 + i * seg;
    s += `<rect class="flow" x="${xa}" y="${top}" width="${seg}" height="${h}"/>`;
    s += `<text x="${xa + 6}" y="${top - 18}" class="lab">${st.name}</text><text x="${xa + 6}" y="${top - 4}">${st.label}</text>`;
    if (i < stages.length - 1) {
      const lw = Math.max(4, (vals[i] - vals[i + 1]) * k), xb = xa + seg;
      s += `<rect class="loss" x="${xb - lw}" y="${top + vals[i + 1] * k}" width="${lw}" height="${H - 30 - top - vals[i + 1] * k}"/>`;
      s += `<text x="${xb - lw / 2}" y="${H - 12}" text-anchor="middle">${stages[i].loss}</text>`;
    }
  });
  return fig(s + '</svg>', unit);
}

// Schéma : largeur et hauteur du viewBox, contenu SVG, légende
const dSV = (w, h, inner, cap = '', max = 440) => fig(`<svg viewBox="0 0 ${w} ${h}" role="img" style="max-width:${max}px">${inner}</svg>`, cap);
// Texte : position, contenu, ancrage (start | middle | end), taille
const dT = (x, y, s, a = 'middle', sz = 14) => `<text x="${+x.toFixed(1)}" y="${+y.toFixed(1)}" text-anchor="${a}" style="font-size:${sz}px">${s}</text>`;
// Flèche du point 1 au point 2 (cls : arrow = bleu, arrowv = orange)
function dA(x1, y1, x2, y2, cls = 'arrow') {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 9, r = n => +n.toFixed(1);
  const p = s => `${r(x2 - h * Math.cos(a + s))} ${r(y2 - h * Math.sin(a + s))}`;
  return `<line class="${cls}" x1="${r(x1)}" y1="${r(y1)}" x2="${r(x2)}" y2="${r(y2)}"/><path class="${cls}" d="M${p(-0.45)} L${r(x2)} ${r(y2)} L${p(0.45)}"/>`;
}
// Cote horizontale ou verticale avec flèches aux deux bouts et texte au milieu
function dCote(x1, y1, x2, y2, s, off = -6) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, hor = Math.abs(y2 - y1) < Math.abs(x2 - x1);
  return dA(mx, my, x1, y1, 'thin') + dA(mx, my, x2, y2, 'thin') + (hor ? dT(mx, my + off, s) : dT(mx + 6, my + 5, s, 'start'));
}
// Roue dentée : centre, rayon primitif, nombre de dents (dessin simplifié)
function dGear(cx, cy, r, z, cls = 'fillv') {
  const n = Math.max(8, Math.min(z, 40)), pts = [];
  for (let k = 0; k < n; k++) {
    const a = 2 * Math.PI * k / n, s = Math.PI / n;
    [[a - s * 0.5, r - 4], [a - s * 0.25, r + 5], [a + s * 0.25, r + 5], [a + s * 0.5, r - 4]]
      .forEach(([t, rr]) => pts.push(`${(cx + rr * Math.cos(t)).toFixed(1)},${(cy + rr * Math.sin(t)).toFixed(1)}`));
  }
  return `<polygon class="${cls}" points="${pts.join(' ')}"/><circle class="thin" cx="${cx}" cy="${cy}" r="${Math.max(3, r * 0.18).toFixed(1)}"/>`;
}
// Appui simple (triangle) sous le point x, y, et sol hachuré
const dAppui = (x, y) => `<path class="thin" d="M${x} ${y} L${x - 10} ${y + 16} H${x + 10} Z"/><line class="thin" x1="${x - 16}" y1="${y + 16}" x2="${x + 16}" y2="${y + 16}"/>` +
  [0, 1, 2, 3].map(k => `<line class="thin" x1="${x - 14 + k * 9}" y1="${y + 16}" x2="${x - 20 + k * 9}" y2="${y + 23}"/>`).join('');
// Encastrement (mur hachuré vertical) à l'abscisse x, de y1 à y2
const dMur = (x, y1, y2) => `<line class="line" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>` +
  Array.from({ length: Math.floor((y2 - y1) / 9) + 1 }, (_, k) => `<line class="thin" x1="${x}" y1="${y1 + k * 9}" x2="${x - 8}" y2="${y1 + k * 9 + 8}"/>`).join('');
// Flèche courbe de rotation autour de (cx, cy), rayon r, de l'angle a1 à a2 (en degrés, sens trigonométrique si a2 > a1)
function dRot(cx, cy, r, a1, a2, cls = 'arrow') {
  const P = a => [cx + r * Math.cos(-a * Math.PI / 180), cy + r * Math.sin(-a * Math.PI / 180)], [x1, y1] = P(a1), [x2, y2] = P(a2);
  const big = Math.abs(a2 - a1) > 180 ? 1 : 0, sweep = a2 > a1 ? 0 : 1, [xp, yp] = P(a2 - Math.sign(a2 - a1) * 12);
  return `<path class="${cls}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${big} ${sweep} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>` + dA(xp, yp, x2, y2, cls).replace(/<line[^>]*\/>/, '');
}

// Chronogramme logique : cells = [{l: 0|1, t: 'étiquette'}], repos à l'état haut avant et après
function wave(cells, cap = '') {
  const cw = Math.min(46, 500 / (cells.length + 2)), x0 = 30, hi = 24, lo = 64, W = x0 * 2 + cw * (cells.length + 2);
  let pts = `${x0},${hi} ${x0 + cw},${hi}`, x = x0 + cw, lab = '';
  cells.forEach(c => {
    const y = c.l ? hi : lo;
    pts += ` ${x},${y} ${x + cw},${y}`;
    lab += `<line class="grid" x1="${x}" y1="14" x2="${x}" y2="${lo + 6}"/><text x="${x + cw / 2}" y="${lo + 22}" text-anchor="middle">${c.t}</text>`;
    x += cw;
  });
  pts += ` ${x},${hi} ${x + cw},${hi}`;
  lab += `<line class="grid" x1="${x}" y1="14" x2="${x}" y2="${lo + 6}"/>`;
  return fig(`<svg viewBox="0 0 ${W} 100" role="img">${lab}<polyline class="c1" points="${pts}"/>
    <text x="4" y="${hi + 4}">1</text><text x="4" y="${lo + 4}">0</text></svg>`, cap);
}

];

const EXO_LIENS = { "Liaisons, classes d'équivalence et graphe des liaisons": [ [ "1-1", "Degrés de liberté et nom des liaisons" ], [ "1-2", "Symboles normalisés des liaisons" ], [ "1-3", "Classes d'équivalence et graphe des liaisons" ], [ "1-4", "Surfaces de contact et liaison associée" ] ], "Mouvements et trajectoires": [ [ "1-5", "Mouvements et trajectoires" ], [ "2-1", "Vitesse en bout de pale et TSR" ] ], "Transformer un mouvement": [ [ "2-2", "Pignon-crémaillère" ], [ "2-5", "Système vis-écrou" ], [ "2-8", "Loi entrée-sortie : course d'un vérin" ], [ "2-7", "Vis de dosage : débit volumique" ] ], "Transmettre la puissance : réducteurs, poulies, treuils": [ [ "2-4", "Réducteur : couple, vitesse et puissance" ], [ "2-3", "Transmission par poulies et courroie" ], [ "2-6", "Treuil : vitesse et force du câble" ], [ "2-9", "Durée d'un cycle de déplacement" ] ], "Actions mécaniques et principe fondamental de la statique": [ [ "3-1", "Actions mécaniques, PFS et stabilité" ], [ "3-2", "Poids et répartition de la charge sur des appuis" ], [ "3-4", "Moment d'une force et couple moteur" ], [ "3-5", "Solide soumis à trois forces" ] ], "Frottement, plan incliné, pression et ressorts": [ [ "3-3", "Plan incliné : composantes du poids" ], [ "3-6", "Frottement et cône de frottement" ], [ "3-7", "Vérin : pression, section et efforts" ], [ "3-8", "Ressort : raideur et effort" ], [ "3-9", "Pression et effort sur une paroi" ] ], "Contraintes, loi de Hooke et coefficient de sécurité": [ [ "4-2", "Contrainte normale et coefficient de sécurité" ], [ "4-1", "Sollicitations simples" ], [ "4-3", "Section minimale d'un câble" ], [ "4-4", "Loi de Hooke : allongement d'un câble" ] ], "Flexion, flèche et simulation": [ [ "4-5", "Flexion : moment quadratique et contrainte" ], [ "4-6", "Flèche d'une poutre et module d'Young" ], [ "4-7", "Exploiter une simulation : masse maximale" ] ], "Familles, propriétés et protection des matériaux": [ [ "5-1", "Familles, propriétés et protection des matériaux" ] ], "Choisir un matériau : Ashby et matrice multicritère": [ [ "5-2", "Indice de performance (méthode d'Ashby)" ], [ "5-3", "Matrice de choix multicritère" ], [ "5-4", "Gain de masse et impact CO₂" ] ], "Procédés de fabrication et cycle de vie": [ [ "5-6", "Procédés de fabrication et d'assemblage" ], [ "5-5", "Cycle de vie et éco-conception" ] ], "Chaîne de puissance, moteur et stockage": [ [ "6-1", "Puissances et rendements en cascade" ], [ "6-2", "Choix d'un moteur" ], [ "6-3", "Puissance et rendement d'un vérin électrique" ], [ "6-4", "Stockeurs d'énergie" ] ], "Plans, géométrie et maquette numérique": [ [ "7-1", "Échelle d'un plan" ], [ "7-2", "Trigonométrie appliquée" ], [ "7-3", "Maquette numérique et conception" ], [ "7-4", "Jeu de fonctionnement" ] ] };

// ---------- Affichage ----------
const nav = document.getElementById('nav');
const card = document.getElementById('card');
let current = 0;

function renderMath(root) {
  root.querySelectorAll('.m').forEach(el => {
    const tex = el.dataset.tex;
    if (window.katex) {
      katex.render(tex, el, { displayMode: !!el.dataset.d, throwOnError: false, strict: false });
    } else {
      el.textContent = tex;
    }
  });
}

// Adapte le contenu visible à la largeur de l'écran :
// - un tableau de 2 ou 3 lignes trop large est présenté en colonnes (transposé) ;
// - une formule centrée trop large est rendue « en ligne », que KaTeX peut couper après = ou +.
function fitToWidth(root) {
  root.querySelectorAll('.tw').forEach(w => {
    const t = w.querySelector('table');
    if (!w.offsetParent || !t || t.dataset.tr || t.rows.length > 3 || w.scrollWidth <= w.clientWidth + 1) return;
    const cells = [...t.rows].map(r => [...r.cells].map(c => c.innerHTML));
    t.innerHTML = cells[0].map((_, c) => `<tr>${cells.map((row, k) => {
      const tag = c === 0 || k === 0 ? 'th' : 'td';
      return `<${tag}>${row[c] ?? ''}</${tag}>`;
    }).join('')}</tr>`).join('');
    t.dataset.tr = '1';
  });
  if (!window.katex) return;
  root.querySelectorAll('.mdisp').forEach(el => {
    if (!el.offsetParent) return;
    if (el.classList.contains('mwrap')) {
      katex.render(el.dataset.tex, el, { displayMode: true, throwOnError: false, strict: false });
      el.classList.remove('mwrap');
      el.style.overflow = '';
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      katex.render(el.dataset.tex, el, { displayMode: false, throwOnError: false, strict: false });
      el.classList.add('mwrap');
      // Quelques pixels de trop (bord d'un cadre) : on laisse déborder dans la marge plutôt que d'afficher un défilement
      if (el.scrollWidth - el.clientWidth <= 8) el.style.overflow = 'visible';
    }
  });
}
let fitTimer;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => fitToWidth(card), 150); });

// Identifiant d'une fiche dans l'adresse : #c<chapitre>-<rang dans le chapitre>
const idOf = i => {
  const c = EXOS[i].chap;
  return `c${c}-${EXOS.slice(0, i + 1).filter(e => e.chap === c).length}`;
};
const ARROW = '<svg class="arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildNav() {
  nav.innerHTML = CHAPITRES.map((titre, c) => `
    <div class="chap">
      <button class="chap-btn" aria-expanded="false">
        ${ARROW}
        <span><span class="seq">Chapitre ${c + 1}</span><span class="ex">${titre}</span></span>
      </button>
      <div class="exlist" hidden>
        ${EXOS.map((e, i) => e.chap === c + 1 ? `<a href="#${idOf(i)}" data-i="${i}">${e.title}</a>` : '').join('')}
      </div>
    </div>`).join('');
  nav.querySelectorAll('.chap-btn').forEach(b => b.onclick = () => toggleChap(b));
  nav.querySelectorAll('.exlist a').forEach(a => a.onclick = ev => { ev.preventDefault(); go(+a.dataset.i); });
}

// Affiche la fiche i et met à jour l'adresse (#c4-1…) sans recharger la page
function go(i) {
  show(i);
  closeMenu();
  window.scrollTo(0, 0);
  try { history.pushState(null, '', '#' + idOf(i)); } catch (err) { /* aperçu hors ligne : on ignore */ }
}

// Ouvre ou ferme un chapitre ; ouvrir un chapitre referme les autres
function toggleChap(btn, open) {
  const list = btn.nextElementSibling;
  list.hidden = open === undefined ? !list.hidden : !open;
  btn.setAttribute('aria-expanded', String(!list.hidden));
  if (!list.hidden) {
    nav.querySelectorAll('.chap-btn').forEach(b => {
      if (b !== btn) { b.nextElementSibling.hidden = true; b.setAttribute('aria-expanded', 'false'); }
    });
  }
  // Le chapitre ouvert est mis en couleur, les autres non
  nav.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('on', !b.nextElementSibling.hidden));
}

function show(i) {
  current = i;
  const e = EXOS[i];
  card.innerHTML = `
    <div class="crumb">ITEC · Chapitre ${e.chap} · ${CHAPITRES[e.chap - 1]}</div>
    <h2>${e.title}</h2>
    <p class="support">${e.support}</p>
    ${e.body}
    <div class="train"><b>S'entraîner sur cette fiche :</b><div class="btns">${(EXO_LIENS[e.title] || [[`${e.chap}-1`, `exercices du chapitre ${e.chap}`]])
      .map(([r, t]) => `<a class="go" href="Exercices_ITEC.html#c${r}">${t} →</a>`).join('')}</div></div>`;
  renderMath(card);
  fitToWidth(card);
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
  nav.querySelectorAll('.chap').forEach((ch, c) => {
    const btn = ch.querySelector('.chap-btn');
    btn.classList.toggle('on', c === e.chap - 1);
    if (c === e.chap - 1) toggleChap(btn, true);
  });
  document.getElementById('prevBtn').style.visibility = i > 0 ? 'visible' : 'hidden';
  document.getElementById('nextBtn').style.visibility = i < EXOS.length - 1 ? 'visible' : 'hidden';
}

function fromHash() {
  const i = EXOS.findIndex((e, k) => '#' + idOf(k) === location.hash);
  show(i >= 0 ? i : 0);
  closeMenu();
  window.scrollTo(0, 0);
}

// Menu mobile
const sidebar = document.getElementById('sidebar'), shade = document.getElementById('shade');
function closeMenu() { sidebar.classList.remove('open'); shade.hidden = true; }
document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('open'); shade.hidden = false; };
shade.onclick = closeMenu;

document.getElementById('prevBtn').onclick = () => go(current - 1);
document.getElementById('nextBtn').onclick = () => go(current + 1);
// Flèches bas et haut du clavier : fiche suivante ou précédente (sauf dans un champ de saisie)
document.getElementById('prevBtn').title = 'Fiche précédente (flèche haut)';
document.getElementById('nextBtn').title = 'Fiche suivante (flèche bas)';
document.addEventListener('keydown', ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  const d = ev.key === 'ArrowDown' ? 1 : ev.key === 'ArrowUp' ? -1 : 0;
  if (!d || current + d < 0 || current + d >= EXOS.length) return;
  ev.preventDefault();
  go(current + d);
});
window.addEventListener('popstate', fromHash);

buildNav();
fromHash();
</script>
</body>
</html>
