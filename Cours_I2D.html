<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours I2D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --side: #efede6;
  --text: #1f1e1c;
  --muted: #6b6a65;
  --border: #dcd9d0;
  --accent: #185fa5;
  --accent-bg: #e6f1fb;
  --val: #854f0b;
  --val-bg: #faeeda;
  --ok: #27500a;
  --ok-bg: #eaf3de;
  --ok-border: #639922;
  --code-bg: #f1efe8;
  --bad-bg: #fcebeb;
  --bad-border: #e24b4a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a;
    --surface: #242422;
    --side: #20201e;
    --text: #ecebe6;
    --muted: #a3a29b;
    --border: #3a3a37;
    --accent: #85b7eb;
    --accent-bg: #0c447c;
    --val: #fac775;
    --val-bg: #4a3209;
    --ok: #c0dd97;
    --ok-bg: #1f3309;
    --ok-border: #639922;
    --code-bg: #2c2c2a;
    --bad-bg: #3d1414;
    --bad-border: #e24b4a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1a;
  --surface: #242422;
  --side: #20201e;
  --text: #ecebe6;
  --muted: #a3a29b;
  --border: #3a3a37;
  --accent: #85b7eb;
  --accent-bg: #0c447c;
  --val: #fac775;
  --val-bg: #4a3209;
  --ok: #c0dd97;
  --ok-bg: #1f3309;
  --ok-border: #639922;
  --code-bg: #2c2c2a;
  --bad-bg: #3d1414;
  --bad-border: #e24b4a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }

/* Barre latérale */
.sidebar {
  background: var(--side);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar h1 { font-size: 18px; font-weight: 600; margin: 0 8px 4px; }
.sidebar .sub { font-size: 13px; color: var(--muted); margin: 0 8px 16px; }
.chap { margin-bottom: 2px; }
.chap-btn {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  text-align: left; border: 0; border-radius: 8px; padding: 8px 8px;
  line-height: 1.35;
}
.chap-btn:hover { background: var(--border); }
.chap-btn .arrow { flex: none; margin-top: 10px; color: var(--muted); transition: transform .15s; }
.chap-btn[aria-expanded="true"] .arrow { transform: rotate(180deg); }
.chap-btn.on .seq, .chap-btn.on .arrow { color: var(--accent); }
.nav .seq { font-size: 12px; color: var(--muted); display: block; }
.nav .ex { font-size: 14px; font-weight: 500; }
.exlist { padding: 2px 0 6px 32px; }
.exlist[hidden] { display: none; }
.exlist a {
  display: block; text-decoration: none; color: var(--text); font-size: 14px;
  padding: 6px 10px; border-radius: 0 8px 8px 0; border-left: 2px solid var(--border);
}
.exlist a:hover { background: var(--border); }
.exlist a.on { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); }

/* Barre du haut (mobile) */
.topbar { display: none; }

/* Contenu */
main { padding: 32px 24px 48px; }
.card {
  max-width: 780px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px 28px;
}
.crumb { font-size: 13px; color: var(--muted); }
.card h2 { font-size: 22px; font-weight: 600; margin: 2px 0 4px; }
.support { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
.v {
  background: var(--val-bg); color: var(--val);
  padding: 1px 5px; border-radius: 5px; font-weight: 500;
  /* Une valeur longue (suite d'événements, octets…) peut passer à la ligne ; nombre et unité restent liés par une espace insécable */
  overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
pre .v { overflow-wrap: normal; }
ol.q { padding-left: 22px; margin: 12px 0 0; }
ol.q li { margin-bottom: 4px; }
pre.code {
  background: var(--code-bg); border-radius: 8px; padding: 12px 14px;
  font-size: 14px; line-height: 1.5; overflow-x: auto; margin: 12px 0;
}
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
button {
  font: inherit; font-size: 15px; cursor: pointer;
  background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px;
}
button:hover { background: var(--side); }
button.primary { border-color: var(--accent); color: var(--accent); }
.correction {
  margin-top: 20px; padding: 14px 18px;
  background: var(--ok-bg); border-left: 4px solid var(--ok-border);
}
.correction[hidden] { display: none; }
.correction h3 { font-size: 15px; font-weight: 600; color: var(--ok); margin: 0 0 8px; }
.step { margin-bottom: 12px; }
.step:last-child { margin-bottom: 0; }
.step .lab { font-size: 14px; font-weight: 600; color: var(--ok); }
.step p { margin: 2px 0; }
.mdisp { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.mdisp.mwrap { text-align: center; line-height: 2.2; margin: 6px 0; }
@media (max-width: 600px) {
  table.t { font-size: 13px; }
  table.t th, table.t td { padding: 3px 6px; }
  pre.code { font-size: 12px; padding: 10px; }
  table.t th, table.t td { overflow-wrap: anywhere; hyphens: auto; }
}
/* QCM */
ol.qcm { padding-left: 22px; margin: 12px 0 0; }
ol.qcm > li { margin-bottom: 14px; }
ol.qcm > li > p { margin: 0 0 6px; }
ol.qcm label {
  display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
  padding: 6px 10px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 8px;
}
ol.qcm label:hover { background: var(--side); }
ol.qcm input { margin-top: 5px; accent-color: var(--accent); }
ol.qcm label.good { border-color: var(--ok-border); background: var(--ok-bg); }
ol.qcm label.bad { border-color: var(--bad-border); background: var(--bad-bg); }
.score { font-weight: 600; color: var(--ok); margin: 0 0 10px; }
.score:empty { display: none; }

/* Tableaux et schémas */
table.t { border-collapse: collapse; margin: 10px 0; font-size: 15px; }
table.t th, table.t td { border: 1px solid var(--border); padding: 4px 10px; text-align: center; }
table.t th { background: var(--side); font-weight: 600; }
.tw { overflow-x: auto; }
figure.fig { margin: 12px 0; text-align: center; }
figure.fig svg { width: 100%; max-width: 560px; height: auto; }
figure.fig svg.small { max-width: 220px; }
svg.sym { display: block; width: 150px; height: auto; margin: 6px 0; }
figure.fig svg.leds { max-width: 400px; }
figcaption { font-size: 13px; color: var(--muted); }
svg text { fill: var(--text); font-size: 12px; font-family: inherit; }
svg text.lab { fill: var(--muted); font-size: 12px; }
svg .grid { stroke: var(--border); stroke-width: 1; }
svg .ax { stroke: var(--muted); stroke-width: 1.4; }
svg .c1 { fill: none; stroke: var(--accent); stroke-width: 2.2; }
svg .c2 { fill: none; stroke: var(--val); stroke-width: 2; }
svg .c3 { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 4; }
svg .pt { fill: var(--val); }
svg .line { stroke: var(--text); stroke-width: 2; fill: none; }
svg .thin { stroke: var(--text); stroke-width: 1.2; fill: none; }
svg .fillv { fill: var(--val-bg); stroke: var(--val); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.4; fill: none; }
svg .arrowv { stroke: var(--val); stroke-width: 2.4; fill: none; }
svg .flow { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1; }
svg .loss { fill: var(--val-bg); stroke: var(--val); stroke-width: 1; }
svg .ledon { fill: #e5484d; stroke: var(--text); }
svg .ledoff { fill: var(--side); stroke: var(--muted); }

/* Fiches de cours */
.card h3 { font-size: 18px; font-weight: 600; color: var(--accent); margin: 26px 0 8px; }
.card p { margin: 8px 0; }
.card p.support { margin: 0 0 16px; }
ul.l { padding-left: 22px; margin: 8px 0; }
ul.l li { margin-bottom: 4px; }
.box, .exm { border-radius: 0 8px 8px 0; padding: 10px 16px; margin: 16px 0; }
.box { background: var(--accent-bg); border-left: 4px solid var(--accent); }
.exm { background: var(--ok-bg); border-left: 4px solid var(--ok-border); }
.box-t { font-size: 14px; font-weight: 600; color: var(--accent); }
.exm .box-t { color: var(--ok); }
.box p, .exm p { margin: 4px 0; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
.blk { border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 10px; background: var(--surface); text-align: center; font-size: 14px; }
.blk span { display: block; font-size: 12px; color: var(--muted); }
.arr { color: var(--accent); font-weight: 600; }
a.go {
  text-decoration: none; border: 1px solid var(--accent); color: var(--accent);
  border-radius: 8px; padding: 8px 16px; font-size: 15px;
}
a.go:hover, a.go:focus-visible { background: var(--accent-bg); outline: none; }
/* Fiches : on ne coupe pas les mots dans les cases, la colonne prend la largeur du mot le plus long */
@media (max-width: 600px) {
  table.t th, table.t td { overflow-wrap: break-word; hyphens: manual; padding: 3px 4px; }
}

.pager { display: flex; justify-content: space-between; gap: 10px; max-width: 780px; margin: 16px auto 0; }
.pager button { font-size: 14px; }

@media (max-width: 860px) {
  .layout { display: block; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 5;
    background: var(--side); border-bottom: 1px solid var(--border); padding: 10px 16px;
  }
  .topbar span { font-weight: 600; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 10; width: 290px; max-width: 85vw;
    transform: translateX(-100%); transition: transform .2s;
  }
  .sidebar.open { transform: none; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }
  .shade[hidden] { display: none; }
  main { padding: 16px 16px 40px; }
  .card { padding: 18px 16px; }
  .card h2 { font-size: 19px; }
}
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" aria-label="Ouvrir le menu">☰</button>
  <span>Cours I2D</span>
</div>
<div class="shade" id="shade" hidden></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <h1>Cours I2D</h1>
    <p class="sub">1re STI2D · fiches de cours</p>
    <div class="nav" id="nav"></div>
  </nav>
  <main>
    <article class="card" id="card"></article>
    <div class="pager">
      <button id="prevBtn">← Précédent</button>
      <button id="nextBtn">Suivant →</button>
    </div>
  </main>
</div>

<script>
// ---------- Outils ----------
const rnd = (a, b, step = 1) => {
  const n = Math.round((b - a) / step);
  return +(a + step * Math.floor(Math.random() * (n + 1))).toFixed(6);
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Nombre au format français (texte)
const fr = (x, d = 2) => Number(x).toLocaleString('fr-FR', { maximumFractionDigits: d });
// Nombre au format français (LaTeX)
const tx = (x, d = 2) => fr(x, d).replace(',', '{,}').replace(/[\u202f\u00a0]/g, '\\,');
// Nombre avec un nombre fixe de décimales (texte / LaTeX)
const frf = (x, d) => Number(x).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const txf = (x, d) => frf(x, d).replace(',', '{,}').replace(/[  ]/g, '\\,');
// Écriture scientifique en LaTeX
const sci = (x, d = 2) => {
  let e = Math.floor(Math.log10(Math.abs(x)));
  if (Math.abs(+(x / 10 ** e).toFixed(d)) >= 10) e++;
  return `${tx(x / 10 ** e, d)} \\times 10^{${e}}`;
};
// Nombre avec s chiffres significatifs : décimal si raisonnable, sinon scientifique
const tn = (x, s = 3) => {
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e-3 && a < 1e6) return tx(x, Math.max(0, s - 1 - Math.floor(Math.log10(a))));
  return sci(x, s - 1);
};
const fn = (x, s = 3) => {
  const a = Math.abs(x);
  if (a === 0) return '0';
  return fr(x, Math.max(0, s - 1 - Math.floor(Math.log10(a))));
};
const deg = a => a * Math.PI / 180;
const G = 9.81;
// Valeur surlignée dans l'énoncé
const v = (x, unit = '', d = 2) => `<span class="v">${typeof x === 'number' ? fr(x, d) : x}${unit ? '\u00a0' + unit : ''}</span>`;
// Formules
const m = t => `<span class="m" data-tex="${t.replace(/"/g, '&quot;')}"></span>`;
const M = t => `<div class="m mdisp" data-d="1" data-tex="${t.replace(/"/g, '&quot;')}"></div>`;
// Unité en LaTeX (gère ², ³, ·, °, µ)
const u = s => '\\,\\text{' + s.replace(/%/g, '\\%').replace(/²/g,'}^2\\text{').replace(/³/g, '}^3\\text{')
  .replace(/·/g, '}\\cdot\\text{').replace(/°/g, '}{}^\\circ\\text{').replace(/[µμ]/g, '}\\mu\\text{') + '}';

// Liste des questions d'un énoncé
const ol = (...items) => `<ol class="q">${items.map(i => `<li>${i}</li>`).join('')}</ol>`;
// Tableau HTML : en-têtes puis lignes
const table = (head, rows) => `<div class="tw"><table class="t"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${
  rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const euro = x => frf(x, 2) + ' €';
const teuro = x => txf(x, 2) + u('€');

// ---------- Tirages ----------
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const sample = (arr, n) => shuffle(arr).slice(0, n);

// ---------- QCM ----------
// Banque : [question, bonne réponse, [mauvaises réponses], explication]
const QCM_N = 5;
function qcm(bank, n = QCM_N) {
  const id = 'q' + Math.random().toString(36).slice(2, 8);
  const items = sample(bank, Math.min(n, bank.length)).map(([q, ok, bad, ex]) => {
    const choices = shuffle([ok, ...sample(bad.filter(b => b !== ok), 3)]);
    return { q, ok, ex, choices, k: choices.indexOf(ok) };
  });
  return {
    qcm: true,
    statement: `<p>Choisir la bonne réponse pour chaque question.</p>
      <ol class="qcm">${items.map((it, i) => `<li data-ok="${it.k}"><p>${it.q}</p>${it.choices.map((c, j) =>
        `<label><input type="radio" name="${id}${i}" value="${j}"> <span>${c}</span></label>`).join('')}</li>`).join('')}</ol>`,
    steps: items.map((it, i) => [`${i + 1}. ${it.ok}`, it.ex ? `<p>${it.ex}</p>` : ''])
  };
}
// Questions construites à partir de couples (élément, réponse)
const fromPairs = (pairs, fmt, ex) =>
  pairs.map(([a, b]) => [fmt(a), b, [...new Set(pairs.map(p => p[1]))], ex ? ex(a, b) : '']);
// Exercice QCM
const Q = (chap, title, support, bank) => ({ chap, title, support, gen: () => qcm(typeof bank === 'function' ? bank() : bank) });

// ---------- Schémas SVG ----------
const fig = (svg, cap = '') => `<figure class="fig">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
// Graphique gradué : o = {x0, x1, dx, y0, y1, dy, xlab, ylab, series: [{pts, cls}], extra(X, Y), nolab}
function graph(o) {
  const W = o.w || 560, H = o.h || 270, L = 50, R = 16, T = 14, B = 34;
  const X = x => +(L + (x - o.x0) / (o.x1 - o.x0) * (W - L - R)).toFixed(1);
  const Y = y => +(H - B - (y - o.y0) / (o.y1 - o.y0) * (H - T - B)).toFixed(1);
  const fx = o.fx || (x => fr(x, 3)), fy = o.fy || (y => fr(y, 3));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graph" role="img">`;
  const nx = Math.round((o.x1 - o.x0) / o.dx), ny = Math.round((o.y1 - o.y0) / o.dy);
  for (let i = 0; i <= nx; i++) {
    const x = o.x0 + i * o.dx;
    s += `<line class="grid" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${H - B}"/>`;
    if (!o.nolab) s += `<text x="${X(x)}" y="${H - B + 15}" text-anchor="middle">${fx(x)}</text>`;
  }
  for (let i = 0; i <= ny; i++) {
    const y = o.y0 + i * o.dy;
    s += `<line class="grid" x1="${L}" y1="${Y(y)}" x2="${W - R}" y2="${Y(y)}"/>`;
    if (!o.nolab) s += `<text x="${L - 6}" y="${Y(y) + 4}" text-anchor="end">${fy(y)}</text>`;
  }
  if (o.y0 < 0 && o.y1 > 0) s += `<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W - R}" y2="${Y(0)}"/>`;
  s += `<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/><line class="ax" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>`;
  if (o.xlab) s += `<text x="${W - R}" y="${H - 4}" text-anchor="end" class="lab">${o.xlab}</text>`;
  if (o.ylab) s += `<text x="${L + 6}" y="${T + 12}" class="lab">${o.ylab}</text>`;
  (o.series || []).forEach(se => {
    s += `<polyline class="${se.cls || 'c1'}" points="${se.pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}"/>`;
  });
  if (o.extra) s += o.extra(X, Y);
  return fig(s + '</svg>', o.cap);
}
// Échantillonne une fonction pour un graphique
const curve = (f, x0, x1, n = 400) => Array.from({ length: n + 1 }, (_, i) => { const x = x0 + (x1 - x0) * i / n; return [x, f(x)]; });
// Diagramme de Sankey en ligne : étapes [{name, val}] (val peut être '?') ; les pertes partent vers le bas
function sankey(stages, vals, unit) {
  const W = 560, H = 220, top = 40, x0 = 20, x1 = W - 20, seg = (x1 - x0) / stages.length;
  const k = 90 / vals[0];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="sankey" role="img">`;
  stages.forEach((st, i) => {
    const h = vals[i] * k, xa = x0 + i * seg;
    s += `<rect class="flow" x="${xa}" y="${top}" width="${seg}" height="${h}"/>`;
    s += `<text x="${xa + 6}" y="${top - 18}" class="lab">${st.name}</text><text x="${xa + 6}" y="${top - 4}">${st.label}</text>`;
    if (i < stages.length - 1) {
      const lw = Math.max(4, (vals[i] - vals[i + 1]) * k), xb = xa + seg;
      s += `<rect class="loss" x="${xb - lw}" y="${top + vals[i + 1] * k}" width="${lw}" height="${H - 30 - top - vals[i + 1] * k}"/>`;
      s += `<text x="${xb - lw / 2}" y="${H - 12}" text-anchor="middle">${stages[i].loss}</text>`;
    }
  });
  return fig(s + '</svg>', unit);
}

// ---------- Chapitres ----------
const CHAPITRES = [
  'Du besoin à la solution technique',
  'Gestion des ressources',
  'Mobilité et transport',
  'Énergie électrique et transition énergétique',
  'Capter et mesurer',
  'Transmettre la puissance',
  'Coder et piloter',
  'Éco-conception, matériaux et habitat'
];

// ---------- Mise en forme des fiches ----------
const H = t => `<h3>${t}</h3>`;
const P = (...t) => t.map(x => `<p>${x}</p>`).join('');
const UL = (...i) => `<ul class="l">${i.map(x => `<li>${x}</li>`).join('')}</ul>`;
// Encadré « À retenir » et exemple résolu
const BOX = (...b) => `<div class="box"><div class="box-t">À retenir</div>${b.join('')}</div>`;
const EX = (t, ...b) => `<div class="exm"><div class="box-t">${t}</div>${b.join('')}</div>`;
// Suite de blocs fonctionnels : [[titre, sous-titre], …]
const CHAIN = items => `<div class="chain">${items.map(([t, s]) => `<div class="blk"><b>${t}</b>${s ? `<span>${s}</span>` : ''}</div>`).join('<span class="arr">→</span>')}</div>`;
const code = s => `<pre class="code">${s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;

// ---------- Fiches de cours (chap = numéro de la séquence) ----------
const EXOS = [
  // ===================== Séquence 1 =====================
  {
    chap: 1,
    title: 'Unités et grandeurs',
    support: 'Cours/TD Unités et grandeurs · fiche ressource « Les unités »',
    body:
      H('1. Le Système international (SI)') +
      P('Les lois de la physique s\'écrivent dans un système d\'unités commun à presque tous les pays : le <b>Système international</b> (SI). Toutes les grandeurs se déduisent de 7 grandeurs de base ; en STI2D on en utilise surtout 5 :') +
      table(['Grandeur', 'Symbole', 'Unité'], [['Longueur', 'L', 'mètre (m)'], ['Masse', 'm', 'kilogramme (kg)'], ['Temps', 't', 'seconde (s)'],
        ['Intensité du courant', 'I', 'ampère (A)'], ['Température', 'T', 'kelvin (K)']]) +
      P('Lire une unité composée : « kg·m » se lit kilogramme-mètre (produit), « m/s » ou « m·s⁻¹ » mètre par seconde (quotient), « m³ » mètre cube.') +
      H('2. Unités dérivées') +
      table(['Grandeur', 'Unité SI', 'Définition'], [['Surface S', 'm²', 'longueur × longueur'], ['Volume V', 'm³', 'surface × longueur'],
        ['Masse volumique ρ', 'kg/m³', 'masse par unité de volume'], ['Vitesse v', 'm/s', 'distance par unité de temps'], ['Accélération a', 'm/s²', 'variation de vitesse par seconde'],
        ['Force F', 'N (newton)', 'cause d\'un mouvement ou d\'une déformation'], ['Pression p', 'Pa (pascal)', 'force par unité de surface : 1 Pa = 1 N/m²'],
        ['Énergie E', 'J (joule)', 'force × déplacement : 1 J = 1 N·m'], ['Puissance P', 'W (watt)', 'énergie par unité de temps : 1 W = 1 J/s'], ['Tension U', 'V (volt)', 'différence de potentiel']]) +
      H('3. Unités usuelles hors SI') +
      table(['Unité', 'Correspondance'], [['degré Celsius (°C)', 'T (K) = θ (°C) + 273,15'], ['litre (L)', '1 L = 1 dm³ = 10⁻³ m³'], ['bar', '1 bar = 10⁵ Pa'],
        ['calorie (cal)', '1 cal ≈ 4,18 J'], ['kilowattheure (kWh)', '1 kWh = 3,6 × 10⁶ J'], ['kilomètre par heure', '1 m/s = 3,6 km/h'], ['heure (h)', '1 h = 60 min = 3 600 s']]) +
      H('4. Multiples et sous-multiples') +
      table(['Préfixe', 'Symbole', 'Facteur'], [['téra', 'T', '10¹²'], ['giga', 'G', '10⁹'], ['méga', 'M', '10⁶'], ['kilo', 'k', '10³'], ['hecto', 'h', '10²'], ['déca', 'da', '10¹'],
        ['déci', 'd', '10⁻¹'], ['centi', 'c', '10⁻²'], ['milli', 'm', '10⁻³'], ['micro', 'µ', '10⁻⁶'], ['nano', 'n', '10⁻⁹'], ['pico', 'p', '10⁻¹²']]) +
      P('<b>Piège des surfaces et des volumes</b> : le préfixe est élevé au carré ou au cube.') +
      M(`1${u('m²')} = 10^4${u('cm²')} = 10^6${u('mm²')}`) + M(`1${u('m³')} = 10^3${u('L')} = 10^6${u('cm³')}`) +
      H('5. Écriture scientifique') +
      P(`Un nombre s'écrit ${m('a \\times 10^n')} avec ${m('1 \\leq a < 10')}. Exemples : 10 000 m = 10⁴ m = 10 km ; 0,003 s = 3 × 10⁻³ s = 3 ms.`) +
      M('10^a \\times 10^b = 10^{a+b} \\qquad \\frac{10^a}{10^b} = 10^{a-b} \\qquad (10^a)^b = 10^{a \\times b}') +
      H('6. Produit en croix') +
      P('Il permet de passer d\'une unité à l\'autre quand on connaît une correspondance. Si 1 cal = 4,18 J, alors :') + M('100\\,\\text{J} = \\frac{100 \\times 1}{4{,}18} \\approx 23{,}9\\,\\text{cal}') +
      H('7. Méthode de résolution') +
      ol('Convertir toutes les données dans les unités SI dès la lecture de l\'énoncé.', 'Nommer clairement chaque grandeur (exemple : vA pour la vitesse au point A).',
        'Écrire la formule littérale et l\'isoler si besoin.', 'Remplacer par les valeurs numériques à la fin seulement (on évite d\'accumuler les arrondis).',
        'Donner le résultat avec son unité et 2 ou 3 chiffres significatifs.') +
      H('8. Formulaire de géométrie') +
      table(['Forme', 'Surface ou volume'], [['Rectangle a × b', 'S = a × b'], ['Triangle (base a, hauteur h)', 'S = a × h / 2'], ['Disque (rayon r, diamètre d)', 'S = π r² = π d² / 4 ; périmètre π d'],
        ['Cube (côté a)', 'V = a³'], ['Pavé droit', 'V = a × b × h'], ['Cylindre', 'V = π r² × h'], ['Sphère', 'V = 4/3 × π r³']]) +
      BOX(P('Toujours convertir en unités SI avant de calculer, et toujours écrire l\'unité du résultat.', 'Attention aux surfaces (×10⁴ de m² en cm²) et aux volumes (1 m³ = 1 000 L).'))
  },
  {
    chap: 1,
    title: 'Grandeurs mécaniques de base et rendement',
    support: 'Fiche ressource « Les unités » · cours Statique et Matériaux',
    body:
      H('1. Vitesse') +
      P('La vitesse moyenne est la distance parcourue divisée par la durée du parcours :') + M('v = \\frac{d}{\\Delta t}') + P(`avec ${m('v')} en m/s, ${m('d')} en m et ${m('\\Delta t')} en s.`) +
      EX('Exemple', P('Un tapis roulant déplace un colis de 12 m en 8 s : v = 12 / 8 = 1,5 m/s, soit 1,5 × 3,6 = 5,4 km/h.')) +
      H('2. Masse volumique') +
      P('C\'est la masse d\'un matériau par unité de volume. Elle permet d\'identifier un matériau.') + M('\\rho = \\frac{m}{V}') + P(`avec ${m('\\rho')} en kg/m³, ${m('m')} en kg et ${m('V')} en m³.`) +
      P('Repères : eau 1 000 kg/m³, air 1,2 kg/m³, aluminium 2 700 kg/m³, acier 7 850 kg/m³, béton 2 400 kg/m³.') +
      EX('Exemple', P('100 mL d\'un liquide pèsent 184 g. On convertit : m = 0,184 kg et V = 0,1 L = 10⁻⁴ m³.') + M('\\rho = \\frac{0{,}184}{10^{-4}} = 1\\,840\\,\\text{kg/m}^3')) +
      H('3. Poids') +
      P('Le poids est la force exercée par la Terre sur un corps. Ne pas le confondre avec la masse : le poids est en newtons, la masse en kilogrammes.') +
      M(`P = m \\times g \\qquad g \\approx 9{,}81${u('N/kg')}`) + P('Une personne de 80 kg a un poids de 80 × 9,81 ≈ 785 N.') +
      H('4. Pression') +
      P('La pression est une force répartie sur une surface :') + M('p = \\frac{F}{S}') + P(`avec ${m('p')} en Pa, ${m('F')} en N et ${m('S')} en m².`) +
      P('Plus la surface d\'appui est grande, plus la pression est faible (raquettes à neige, fondations d\'un mur). Rappel : 1 bar = 10⁵ Pa.') +
      H('5. Rendement') +
      P('Toute conversion d\'énergie s\'accompagne de pertes (le plus souvent de la chaleur). Le rendement compare la puissance utile à la puissance absorbée :') +
      M('\\eta = \\frac{P_u}{P_a} \\qquad P_{pertes} = P_a - P_u') +
      P('Le rendement n\'a pas d\'unité et vaut toujours moins de 1 (ou 100 %). Pour une chaîne de constituants placés les uns après les autres, les rendements se multiplient :') +
      M('\\eta_{global} = \\eta_1 \\times \\eta_2 \\times \\eta_3 \\times \\dots') +
      EX('Exemple', P('Batterie (η = 0,95), variateur (0,97), moteur (0,85) et réducteur (0,9) :') + M('\\eta = 0{,}95 \\times 0{,}97 \\times 0{,}85 \\times 0{,}9 \\approx 0{,}70') +
        P('Pour 100 W utiles, il faut donc fournir 100 / 0,70 ≈ 143 W.')) +
      BOX(P('v = d / Δt ; ρ = m / V ; P = m·g ; p = F / S ; η = Pu / Pa.', 'Les rendements d\'une chaîne se multiplient, ils ne s\'additionnent pas.'))
  },
  {
    chap: 1,
    title: 'Chaînes de puissance et d\'information',
    support: 'Cours Chaînes de puissance et d\'information · TP Chaînes d\'énergie et d\'information',
    body:
      H('1. Système technique') +
      P('Un <b>système technique</b> est un assemblage de constituants qui réalisent chacun une fonction élémentaire (alimenter, convertir…). C\'est l\'assemblage de ces fonctions qui permet de réaliser une fonction plus complexe.') +
      P('Un système est défini par :') + UL('la nature des éléments qui le composent ;', 'les interactions entre ces éléments ;', 'sa frontière (ce qui fait partie du système et ce qui appartient à son environnement) ;', 'ses interactions avec l\'environnement.') +
      P('On peut comparer un système à un être humain : la <b>chaîne d\'information</b> est son cerveau (elle reçoit des informations, décide et donne des ordres), la <b>chaîne de puissance</b> (ou chaîne d\'énergie) ses muscles (elle agit sur la matière).') +
      H('2. La chaîne d\'information') +
      P('Elle acquiert des informations, les traite (souvent par un programme) puis les communique : à l\'utilisateur, à un autre système ou à la chaîne de puissance sous forme d\'ordres.') +
      CHAIN([['Acquérir', 'capteurs, boutons'], ['Traiter', 'microcontrôleur, automate'], ['Communiquer', 'écran, voyant, radio']]) +
      table(['Fonction', 'Exemples de constituants'], [['Acquérir', 'capteur, détecteur, bouton-poussoir, clavier, caméra'], ['Traiter', 'microcontrôleur (Arduino), automate programmable, ordinateur'],
        ['Communiquer', 'écran, voyant, haut-parleur, module Wi-Fi ou Bluetooth, liaison filaire']]) +
      H('3. La chaîne de puissance') +
      P('Elle reçoit l\'énergie et la transforme pour agir sur la matière d\'œuvre (déplacer, chauffer, éclairer…).') +
      CHAIN([['Alimenter', 'batterie, réseau'], ['Distribuer', 'variateur, relais'], ['Convertir', 'moteur, vérin'], ['Transmettre', 'réducteur'], ['Agir', 'roue, pince']]) +
      table(['Fonction', 'Rôle', 'Exemples'], [['Alimenter', 'fournir l\'énergie', 'batterie, réseau électrique, panneau photovoltaïque'], ['Distribuer', 'doser l\'énergie selon les ordres reçus', 'variateur de vitesse, relais, contacteur, distributeur pneumatique'],
        ['Convertir', 'changer la forme de l\'énergie', 'moteur électrique, vérin, résistance chauffante, lampe'], ['Transmettre', 'adapter et transporter l\'énergie mécanique', 'réducteur, engrenages, poulies-courroie, vis-écrou'],
        ['Agir', 'agir sur la matière d\'œuvre', 'roue, pince, tapis, hélice']]) +
      EX('Exemple : le robot Robovolc', P('Batterie (stocker et restituer l\'électricité) → variateur (faire varier l\'énergie apportée au moteur) → moteur électrique (convertir l\'énergie électrique en énergie mécanique) → réducteur (adapter la vitesse de rotation) → roue (déplacer le robot).')) +
      H('4. Interaction des deux chaînes') +
      P('Les deux chaînes travaillent ensemble : la chaîne d\'information envoie des <b>ordres</b> à la fonction Distribuer ; les capteurs lui renvoient des <b>comptes rendus</b> sur l\'état du système. L\'utilisateur dialogue avec la chaîne d\'information grâce à une <b>IHM</b> (interface homme-machine).') +
      P('Entre les constituants circulent trois types de flux : <b>énergie</b>, <b>matière</b> et <b>information</b>. La matière d\'œuvre entre dans le système, est transformée par la chaîne de puissance et ressort avec une valeur ajoutée.') +
      BOX(P('Chaîne d\'information : Acquérir → Traiter → Communiquer.', 'Chaîne de puissance : Alimenter → Distribuer → Convertir → Transmettre → Agir.', 'La chaîne d\'information commande la fonction Distribuer de la chaîne de puissance.'))
  },

    support: 'Cours Sources d\'énergie · PC Conversion d\'énergie dans les systèmes',
    body:
      H('1. Qu\'est-ce que l\'énergie ?') +
      P('L\'énergie mesure la capacité d\'un système à modifier un état : produire un mouvement, de la chaleur ou un rayonnement (lumière). Elle se présente sous plusieurs <b>formes</b> :') +
      table(['Forme', 'Exemples'], [['Mécanique', 'cinétique (objet en mouvement), potentielle (eau d\'un barrage en hauteur)'], ['Thermique', 'chaleur d\'un radiateur, d\'un moteur'],
        ['Électrique', 'courant dans un câble'], ['Chimique', 'carburant, aliments, batterie'], ['Nucléaire', 'fission de l\'uranium'], ['Rayonnante', 'lumière du Soleil']]) +
      H('2. Sources renouvelables ou non') +
      UL('<b>Non renouvelables</b> (stock) : quantité limitée, renouvellement beaucoup trop lent par rapport à notre consommation. Pétrole, gaz naturel, charbon, uranium.',
        '<b>Renouvelables</b> (flux) : renouvellement assez rapide à l\'échelle humaine pour paraître inépuisable, à condition de ne pas consommer plus que ce qui se renouvelle. Soleil, vent, eau (hydraulique), biomasse, géothermie, marées.') +
      H('3. Conservation de l\'énergie') +
      P('L\'énergie ne se crée pas et ne disparaît pas : elle se transforme. Le mouvement perpétuel n\'existe pas.') + M('E_{initiale} = E_{finale} + \\text{pertes}') +
      P('Toute transformation produit des pertes, le plus souvent sous forme de chaleur. Dans les pays développés, elles représentent 60 à 70 % de l\'énergie de départ.') +
      table(['Convertisseur', 'Énergie d\'entrée', 'Énergie de sortie'], [['Moteur électrique', 'électrique', 'mécanique'], ['Alternateur, génératrice', 'mécanique', 'électrique'],
        ['Panneau photovoltaïque', 'rayonnante', 'électrique'], ['Radiateur électrique', 'électrique', 'thermique'], ['Batterie en décharge', 'chimique', 'électrique'], ['Moteur thermique', 'chimique', 'mécanique']]) +
      H('4. Énergie primaire, secondaire, finale et utile') +
      table(['Catégorie', 'Définition', 'Exemple'], [['Primaire', 'disponible dans la nature, avant toute transformation', 'pétrole brut, vent, uranium'],

      H('5. Unités de l\'énergie') +
      UL('<b>Joule (J)</b> : énergie consommée par un appareil de 1 W pendant 1 s (1 J = 1 W·s).', '<b>Kilowattheure (kWh)</b> : 1 000 W pendant 1 h, soit 1 kWh = 1 000 × 3 600 = 3,6 × 10⁶ J = 3,6 MJ.',
        '<b>Tonne équivalent pétrole (tep)</b> : énergie dégagée par la combustion d\'une tonne de pétrole ; 1 tep = 11 630 kWh.') +
      EX('Exemple', P('Une éolienne de 2 MW produit 4,4 GWh par an :') + M('\\frac{4{,}4 \\times 10^6\\,\\text{kWh}}{11\\,630} \\approx 378\\,\\text{tep}') +
        P('Un réacteur nucléaire de 900 MW produit 6 000 GWh par an, soit l\'équivalent de 6 000 / 4,4 ≈ 1 364 éoliennes.')) +

  {
    chap: 2,
    title: 'Énergie, puissance et coût',
    support: 'Cours Grandeurs électriques (rappels sur l\'énergie) · TD Calculs et conversions de base',
    body:
      H('1. Énergie et puissance') +
      P('La puissance est la quantité d\'énergie transférée par unité de temps. Avec une même quantité d\'énergie, on peut utiliser beaucoup de puissance pendant peu de temps, ou peu de puissance pendant longtemps :') +
      M(`E = P \\times \\Delta t`) + table(['Si P est en…', 'et Δt en…', 'alors E est en…'], [['W', 's', 'J'], ['W', 'h', 'Wh'], ['kW', 'h', 'kWh']]) +
      P('On utilise le Wh ou le kWh pour l\'électricité car le joule est une unité trop petite : un foyer consomme de l\'ordre de 10 000 kWh par an, soit 3,6 × 10¹⁰ J.') +

// ---------- Affichage ----------
const nav = document.getElementById('nav');
const card = document.getElementById('card');
let current = 0;

function renderMath(root) {
  root.querySelectorAll('.m').forEach(el => {
    const tex = el.dataset.tex;
    if (window.katex) {
      katex.render(tex, el, { displayMode: !!el.dataset.d, throwOnError: false, strict: false });
    } else {
      el.textContent = tex;
    }
  });
}

// Adapte le contenu visible à la largeur de l'écran :
// - un tableau de 2 ou 3 lignes trop large est présenté en colonnes (transposé) ;
// - une formule centrée trop large est rendue « en ligne », que KaTeX peut couper après = ou +.
function fitToWidth(root) {
  root.querySelectorAll('.tw').forEach(w => {
    const t = w.querySelector('table');
    if (!w.offsetParent || !t || t.dataset.tr || t.rows.length > 3 || w.scrollWidth <= w.clientWidth + 1) return;
    const cells = [...t.rows].map(r => [...r.cells].map(c => c.innerHTML));
    t.innerHTML = cells[0].map((_, c) => `<tr>${cells.map((row, k) => {
      const tag = c === 0 || k === 0 ? 'th' : 'td';
      return `<${tag}>${row[c] ?? ''}</${tag}>`;
    }).join('')}</tr>`).join('');
    t.dataset.tr = '1';
  });
  if (!window.katex) return;
  root.querySelectorAll('.mdisp').forEach(el => {
    if (!el.offsetParent) return;
    if (el.classList.contains('mwrap')) {
      katex.render(el.dataset.tex, el, { displayMode: true, throwOnError: false, strict: false });
      el.classList.remove('mwrap');
      el.style.overflow = '';
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      katex.render(el.dataset.tex, el, { displayMode: false, throwOnError: false, strict: false });
      el.classList.add('mwrap');
      // Quelques pixels de trop (bord d'un cadre) : on laisse déborder dans la marge plutôt que d'afficher un défilement
      if (el.scrollWidth - el.clientWidth <= 8) el.style.overflow = 'visible';
    }
  });
}
let fitTimer;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => fitToWidth(card), 150); });

// Identifiant d'une fiche dans l'adresse : #c<chapitre>-<rang dans le chapitre>
const idOf = i => {
  const c = EXOS[i].chap;
  return `c${c}-${EXOS.slice(0, i + 1).filter(e => e.chap === c).length}`;
};
const ARROW = '<svg class="arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildNav() {
  nav.innerHTML = CHAPITRES.map((titre, c) => `
    <div class="chap">
      <button class="chap-btn" aria-expanded="false">
        ${ARROW}
        <span><span class="seq">Séquence ${c + 1}</span><span class="ex">${titre}</span></span>
      </button>
      <div class="exlist" hidden>
        ${EXOS.map((e, i) => e.chap === c + 1 ? `<a href="#${idOf(i)}" data-i="${i}">${e.title}</a>` : '').join('')}
      </div>
    </div>`).join('');
  nav.querySelectorAll('.chap-btn').forEach(b => b.onclick = () => toggleChap(b));
  nav.querySelectorAll('.exlist a').forEach(a => a.onclick = ev => { ev.preventDefault(); go(+a.dataset.i); });
}

// Affiche la fiche i et met à jour l'adresse (#c4-1…) sans recharger la page
function go(i) {
  show(i);
  closeMenu();
  window.scrollTo(0, 0);
  try { history.pushState(null, '', '#' + idOf(i)); } catch (err) { /* aperçu hors ligne : on ignore */ }
}

// Ouvre ou ferme un chapitre ; ouvrir un chapitre referme les autres
function toggleChap(btn, open) {
  const list = btn.nextElementSibling;
  list.hidden = open === undefined ? !list.hidden : !open;
  btn.setAttribute('aria-expanded', String(!list.hidden));
  if (!list.hidden) {
    nav.querySelectorAll('.chap-btn').forEach(b => {
      if (b !== btn) { b.nextElementSibling.hidden = true; b.setAttribute('aria-expanded', 'false'); }
    });
  }
}

function show(i) {
  current = i;
  const e = EXOS[i];
  card.innerHTML = `
    <div class="crumb">Séquence ${e.chap} · ${CHAPITRES[e.chap - 1]}</div>
    <h2>${e.title}</h2>
    <p class="support">${e.support}</p>
    ${e.body}
    <div class="btns"><a class="go" href="Exercices_I2D.html#c${e.chap}-1">S'entraîner : exercices de la séquence ${e.chap} →</a></div>`;
  renderMath(card);
  fitToWidth(card);
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
  nav.querySelectorAll('.chap').forEach((ch, c) => {
    const btn = ch.querySelector('.chap-btn');
    btn.classList.toggle('on', c === e.chap - 1);
    if (c === e.chap - 1) toggleChap(btn, true);
  });
  document.getElementById('prevBtn').style.visibility = i > 0 ? 'visible' : 'hidden';
  document.getElementById('nextBtn').style.visibility = i < EXOS.length - 1 ? 'visible' : 'hidden';
}

function fromHash() {
  const i = EXOS.findIndex((e, k) => '#' + idOf(k) === location.hash);
  show(i >= 0 ? i : 0);
  closeMenu();
  window.scrollTo(0, 0);
}

// Menu mobile
const sidebar = document.getElementById('sidebar'), shade = document.getElementById('shade');
function closeMenu() { sidebar.classList.remove('open'); shade.hidden = true; }
document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('open'); shade.hidden = false; };
shade.onclick = closeMenu;

document.getElementById('prevBtn').onclick = () => go(current - 1);
document.getElementById('nextBtn').onclick = () => go(current + 1);
window.addEventListener('popstate', fromHash);

buildNav();
fromHash();
</script>
</body>
</html>
